- hosts: localhost
  become: true

  vars:
    token: "783bde.3f89s0fje9f38fhf"
    swap_disabled: true
    
    # Configuration réseau des Pods requise pour Calico
    kubernetes_pod_network:
      cni: 'none'
      cidr: '192.168.0.0/16'  
    
    # Utilisation explicite de l'interface réseau eth1 de Vagrant
    kubernetes_kubelet_extra_args: "--node-ip={{ ansible_facts['eth1']['ipv4']['address'] }}"

    crictl_version: "v1.31.1"
    kubernetes_config_kubelet_configuration:
      cgroupDriver: "systemd"
      failSwapOn: false
    kubernetes_config_kube_proxy_configuration:
      ipvs:
        strictARP: true
    kubernetes_config_init_configuration:
      localAPIEndpoint:
        advertiseAddress: "{{ kubernetes_apiserver_advertise_address | default(ansible_default_ipv4.address, true) }}"
      bootstrapTokens:
        - token: "{{ token }}"
          description: "another bootstrap token"
          usages:
          - authentication
          - signing
          groups:
          - system:bootstrappers:kubeadm:default-node-token
    kubernetes_allow_pods_on_master: true

  pre_tasks:
  - name: Enable br_netfilter module
    modprobe:
      name: br_netfilter
      state: present
    when: >
      ansible_distribution != 'Debian' 

  - name: disable swap
    shell: |
      swapoff -a
      sudo sed -i 's/^\(.*swap.*\)$/#\1/' /etc/fstab
    when: swap_disabled == true

  - name: ipforward to 1
    sysctl:
      name: net.ipv4.ip_forward
      value: '1'
      sysctl_set: true
      state: present

  roles:
    - role: geerlingguy.pip
    - role: geerlingguy.containerd
    - role: geerlingguy.kubernetes

  post_tasks:
  - name: Install Tigera Operator from Vagrant shared folder
    ansible.builtin.shell: kubectl create -f /vagrant/calico/tigera-operator.yaml
    when: kubernetes_role == 'control_plane'
    ignore_errors: yes

  - name: Copy Custom Resources to /tmp to avoid modifying the host Windows file
    ansible.builtin.copy:
      src: /vagrant/calico/calico-custom-resources.yaml
      dest: /tmp/calico-custom-resources.yaml
      remote_src: yes
    when: kubernetes_role == 'control_plane'

  - name: Configure Calico Custom Resources (Pod CIDR & eth1 interface)
    ansible.builtin.shell: |
      # Ajuster le bloc CIDR des pods si nécessaire
      sed -i 's|cidr: 192.168.0.0/16|cidr: 192.168.0.0/16|' /tmp/calico-custom-resources.yaml
      
      # Injection de la détection de l'interface eth1 (propre à l'architecture Vagrant)
      if ! grep -q "nodeAddressAutodetectionV4" /tmp/calico-custom-resources.yaml; then
        sed -i '/calicoNetwork:/a\    nodeAddressAutodetectionV4:\n      interface: eth1' /tmp/calico-custom-resources.yaml
      fi
    when: kubernetes_role == 'control_plane'

  - name: Apply Calico Custom Resources configuration
    ansible.builtin.shell: kubectl create -f /tmp/calico-custom-resources.yaml
    when: kubernetes_role == 'control_plane'
    ignore_errors: yes

  - name: Download crictl binary
    get_url:
      url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
      dest: /tmp/crictl.tar.gz
      mode: '0644'
      force: false  # évite de re-télécharger si le fichier existe déjà

  - name: Extract crictl binary
    ansible.builtin.unarchive:
      src: /tmp/crictl.tar.gz
      dest: /usr/local/bin
      remote_src: true
      mode: '0755'
      creates: /usr/local/bin/crictl

  - name: Remove crictl archive
    ansible.builtin.file:
      path: /tmp/crictl.tar.gz
      state: absent

  - name: Create crictl configuration directory
    ansible.builtin.file:
      path: /etc/crictl.d
      state: directory

  - name: Configure crictl
    ansible.builtin.copy:
      content: |
        runtime-endpoint: unix:///var/run/containerd/containerd.sock
        image-endpoint: unix:///var/run/containerd/containerd.sock
        timeout: 2
        debug: true
        pull-image-on-create: false
      dest: /etc/crictl.yaml    
